<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Logo high tech minimalista — editável</title>
  <desc>Ícone vetorial com moldura arredondada, anel aberto e quatro barras crescentes em gradiente roxo, azul e ciano.</desc>
  <defs>
    <linearGradient id="neon" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d52cff"/>
      <stop offset="42%" stop-color="#542cff"/>
      <stop offset="72%" stop-color="#087cff"/>
      <stop offset="100%" stop-color="#21f4ff"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f38cff"/><stop offset="0.48" stop-color="#9b19ff"/><stop offset="1" stop-color="#6500ef"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a6caff"/><stop offset="0.48" stop-color="#4c63ff"/><stop offset="1" stop-color="#5a16f5"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8befff"/><stop offset="0.5" stop-color="#168cff"/><stop offset="1" stop-color="#283dff"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#64faff"/><stop offset="0.5" stop-color="#087cff"/><stop offset="1" stop-color="#00d9ed"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#080b2a"/><stop offset="1" stop-color="#020416"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo: remova este retângulo para exportar com transparência. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Moldura externa -->
  <rect x="125" y="124" width="774" height="776" rx="220" fill="none" stroke="url(#neon)" stroke-width="3" opacity=".95" filter="url(#subtleGlow)"/>

  <!-- Anel aberto -->
  <circle cx="512" cy="512" r="322" fill="none" stroke="url(#neon)" stroke-width="22" stroke-linecap="round" stroke-dasharray="1900 124" stroke-dashoffset="-55" filter="url(#softGlow)"/>
  <circle cx="512" cy="512" r="322" fill="none" stroke="url(#neon)" stroke-width="13" stroke-linecap="round" stroke-dasharray="1900 124" stroke-dashoffset="-55"/>

  <!-- Barras crescentes -->
  <g filter="url(#subtleGlow)">
    <rect x="297" y="520" width="87" height="150" rx="31" fill="url(#bar1)" stroke="#e9a0ff" stroke-width="2.5"/>
    <rect x="407" y="465" width="87" height="205" rx="31" fill="url(#bar2)" stroke="#b6c5ff" stroke-width="2.5"/>
    <rect x="517" y="410" width="87" height="260" rx="31" fill="url(#bar3)" stroke="#8deaff" stroke-width="2.5"/>
    <rect x="627" y="340" width="87" height="330" rx="31" fill="url(#bar4)" stroke="#72faff" stroke-width="2.5"/>
  </g>

  <!-- Reflexos discretos nas barras -->
  <g fill="none" stroke="#ffffff" stroke-width="2" opacity=".28">
    <path d="M315 548 V548 Q315 536 327 536"/>
    <path d="M425 493 V493 Q425 481 437 481"/>
    <path d="M535 438 V438 Q535 426 547 426"/>
    <path d="M645 368 V368 Q645 356 657 356"/>
  </g>
</svg>
